name: Publish research snapshots

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_market_data:
        description: Refresh the closing market snapshot before publishing
        type: boolean
        default: false
  schedule:
    - cron: '17 18 * * 1-5'
      timezone: America/New_York

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: ${{ github.event_name == 'schedule' || inputs.refresh_market_data }}
      - name: Prepare source
        id: source
        run: |
          if [ ! -f package.json ] && [ -f research-source.zip ]; then
            echo '7274b403bfcf73bf8f1c4328466e03878a8826cbc5775864410d0e4439192c63  research-source.zip' | sha256sum -c -
            unzip -nq research-source.zip
          fi
          if [ -f package.json ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.source.outputs.ready == 'true'
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: steps.source.outputs.ready == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.source.outputs.ready == 'true'
      - name: Refresh closing data
        id: refresh
        if: steps.source.outputs.ready == 'true' && (github.event_name == 'schedule' || inputs.refresh_market_data)
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            node scripts/close-snapshot.mjs refresh --force
          else
            node scripts/close-snapshot.mjs refresh
          fi
          if [ -f .github/close-snapshot.json ]; then
            git add -f .github/close-snapshot.json
          fi
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Save US market close snapshot"
            git push origin HEAD:main
          fi
      - name: Apply saved data and calculate closing signals
        if: steps.source.outputs.ready == 'true'
        run: node scripts/close-snapshot.mjs apply
      - run: node scripts/build-pages.mjs
        if: steps.source.outputs.ready == 'true'
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/configure-pages@v5
        if: steps.source.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.source.outputs.ready == 'true'
        with:
          path: dist/pages
      - uses: actions/deploy-pages@v4
        if: steps.source.outputs.ready == 'true'
        id: deploy
      - name: Report incomplete data refresh
        if: steps.refresh.outputs.incomplete == 'true'
        run: exit 1
