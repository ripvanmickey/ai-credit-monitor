name: Publish research snapshots

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_market_data:
        description: Refresh the closing market snapshot before publishing
        type: boolean
        default: false
      refresh_memory_data:
        description: Check the public memory spot board before publishing
        type: boolean
        default: false
  schedule:
    - cron: '15 11 * * *'
    - cron: '37 17,20,23 * * 1-5'
      timezone: America/New_York

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: ${{ github.event_name == 'schedule' || inputs.refresh_market_data || inputs.refresh_memory_data || (github.event_name == 'push' && contains(github.event.head_commit.message, '[refresh-market]')) }}
      - name: Prepare source
        id: source
        run: |
          if [ ! -f package.json ] && [ -f research-source.zip ]; then
            echo '7274b403bfcf73bf8f1c4328466e03878a8826cbc5775864410d0e4439192c63  research-source.zip' | sha256sum -c -
            unzip -nq research-source.zip
          fi
          if [ -f package.json ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Record public memory quotes
        id: memory
        if: steps.source.outputs.ready == 'true' && (github.event.schedule == '15 11 * * *' || inputs.refresh_memory_data)
        run: |
          python3 scripts/refresh-memory.py
          if ! git diff --quiet -- cycle-public/memory-data.json; then
            git add cycle-public/memory-data.json
            git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Record public memory spot quotes"
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Decide whether to publish
        id: publish
        if: steps.source.outputs.ready == 'true'
        env:
          MEMORY_SCHEDULE: ${{ github.event.schedule == '15 11 * * *' }}
          MEMORY_CHANGED: ${{ steps.memory.outputs.changed }}
        run: |
          if [ "$MEMORY_SCHEDULE" != 'true' ] || [ "$MEMORY_CHANGED" = 'true' ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.publish.outputs.ready == 'true'
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: steps.publish.outputs.ready == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.publish.outputs.ready == 'true'
      - name: Refresh closing data
        id: refresh
        if: steps.publish.outputs.ready == 'true' && (github.event.schedule == '37 17,20,23 * * 1-5' || inputs.refresh_market_data || (github.event_name == 'push' && contains(github.event.head_commit.message, '[refresh-market]')))
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            node scripts/close-snapshot.mjs refresh --force
          else
            node scripts/close-snapshot.mjs refresh
          fi
          if [ -f .github/close-snapshot.json ]; then
            git add -f .github/close-snapshot.json
          fi
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Save US market close snapshot"
            git push origin HEAD:main
          fi
      - name: Apply saved data and calculate closing signals
        if: steps.publish.outputs.ready == 'true'
        run: node scripts/close-snapshot.mjs apply
      - run: node scripts/build-pages.mjs
        if: steps.publish.outputs.ready == 'true'
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/configure-pages@v5
        if: steps.publish.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.publish.outputs.ready == 'true'
        with:
          path: dist/pages
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for this attempt's Pages artifact
        id: pages_artifact
        if: steps.publish.outputs.ready == 'true'
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
        with:
          script: |
            for (let attempt = 0; attempt < 18; attempt++) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100
              });
              const artifact = artifacts.find(item => item.name === process.env.PAGES_ARTIFACT && !item.expired);
              if (artifact) {
                core.info('Pages artifact is available: ' + artifact.id);
                core.setOutput('artifact_id', String(artifact.id));
                return;
              }
              core.info('Waiting for uploaded Pages artifact metadata');
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.setFailed('Uploaded Pages artifact is not yet visible to the deployment API');
      - name: Deploy the verified Pages artifact
        if: steps.publish.outputs.ready == 'true'
        id: deploy
        uses: actions/github-script@v7
        timeout-minutes: 12
        env:
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        with:
          script: |
            const artifactId = process.env.PAGES_ARTIFACT_ID;
            if (!/^\d+$/.test(artifactId)) throw new Error('Missing verified artifact ID');
            const artifact = await github.rest.actions.getArtifact({
              ...context.repo, artifact_id: Number(artifactId)
            });
            if (artifact.data.expired || artifact.data.workflow_run.id !== context.runId) {
              throw new Error('Pages artifact does not belong to the current run');
            }
            const idToken = await core.getIDToken();
            const {data: deployment} = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo,
              artifact_id: Number(artifactId),
              pages_build_version: context.sha,
              oidc_token: idToken
            });
            core.setOutput('page_url', deployment.page_url);
            core.info('Created Pages deployment ' + deployment.id);
            for (let attempt = 0; attempt < 120; attempt++) {
              const {data: state} = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', {
                ...context.repo, deploymentId: deployment.id
              });
              if (state.status === 'succeed') {
                core.info('Pages deployment succeeded');
                return;
              }
              if (['deployment_failed', 'deployment_perms_error', 'deployment_content_failed',
                'deployment_cancelled', 'deployment_lost'].includes(state.status)) {
                throw new Error('Pages deployment failed: ' + state.status);
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel', {
              ...context.repo, deploymentId: deployment.id
            });
            throw new Error('Timed out waiting for Pages deployment');
      - name: Report incomplete data refresh
        if: steps.refresh.outputs.incomplete == 'true'
        run: exit 1
